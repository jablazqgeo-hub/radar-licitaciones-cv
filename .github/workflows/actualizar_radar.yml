name: Actualizar Radar de Licitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar solo novedades desde la última sincronización
        env:
          RADAR_RETENTION_DAYS: "90"
          RADAR_OVERLAP_HOURS: "12"
          RADAR_BOOTSTRAP_DAYS: "3"
          RADAR_MAX_PAGES_PER_SOURCE: "40"
        run: python updater.py

      - name: Guardar resultados en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones.csv data/metadata.json
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualización incremental automática del radar"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
